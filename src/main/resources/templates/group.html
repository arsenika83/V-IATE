<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>V-IATE - Группы</title>
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/common.css" rel="stylesheet">
  <link href="/css/schedule.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<header class="site-header">
  <div class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
      <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
        <img class="bi me-2" width="80" height="80" role="img" aria-label="Logo" src="../images/logo.png"></use></img>
      </a>
      <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
        <li><a href="/" class="button-header">Главная</a></li>
        <li><a href="/group" class="button-header">Расписание</a></li>
        <li><a href="/course" class="button-header">Курсы</a></li>
        <li><a href="/journal" class="button-header">Журналы</a></li>
      </ul>
      <div class="text-end">
        <a th:if="${user_name == null}" class="button-login" href="/login">Вход</a>
        <a th:if="${user_name != null}" class="button-login" href="/profile">Профиль</a>
        <img th:if="${user_name != null}" class="img-user" src="../images/user.png">
      </div>
    </div>
  </div>
</header>

<div class="groups-page">

  <div class="groups-align" th:if="${user_name != null}">
    <h2 class="course">Моё расписание</h2>
      <div class="flex-buttons">
        <a th:class="button-href" th:href="@{/schedule/{id} (id = ${current_user_group.getId()})}" th:text="${current_user_group.getName()}"></a>
      </div>
  </div>

  <div class="groups-align" th:each="course : ${courses}">
    <h2 class="course" th:text="${course} + ' КУРС'"></h2>

    <div class="buttons-group">
      <a th:each="group : ${groups_list.get(course-1)}" th:if="${group.id != -1}" th:class="button-href" th:href="@{/schedule/{id} (id = ${group.id})}" th:text="${group.name}"></a>
    </div>

  </div>
</div>

<footer class="site-footer">
  <div class="footer-content">
    <p>© 2025–2026 V-IATE</p>
  </div>
</footer>
</body>
</html>
