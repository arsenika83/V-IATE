<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Группы — V‑IATE</title>
    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/schedule.css" rel="stylesheet">
    <link rel="icon" href="/images/favicon.ico">

</head>
<body>

<header class="site-header">
    <div class="header-container">
        <a href="/" class="logo-link">
            <img src="/images/logo.png" alt="V-IATE" class="logo-img">
        </a>
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="/" class="nav-link">Главная</a></li>
                <li><a href="/group" class="nav-link active">Расписание</a></li>
                <li><a href="/course_lobby" class="nav-link">Курсы</a></li>
                <li><a href="/journal" class="nav-link">Журналы</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a th:if="${user_name == null}" href="/login" class="btn-login">Вход</a>
            <div th:if="${user_name != null}" class="user-profile">
                <span class="user-greeting" th:text="${user_name}"></span>
                <a href="/profile" class="profile-link">
                    <img src="/images/user.png" alt="Профиль" class="user-avatar">
                </a>
                <a href="/logout" class="logout-link">Выйти</a>
            </div>
        </div>
    </div>
</header>

<main class="main-content">

    <!-- Поисковая панель -->
    <div class="search-container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="search-input-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text"
                           id="searchInput"
                           class="form-control search-input"
                           placeholder="Поиск..."
                           autocomplete="off">
                    <i class="fas fa-times-circle clear-search" id="clearSearch"></i>
                </div>

                <!-- Быстрые фильтры -->
                <div class="mt-3" id="quickFilters">
                    <span class="search-tag" data-filter="course_1">Первый курс</span>
                </div>

                <!-- Статистика поиска -->
                <div class="search-stats" id="searchStats">
                    <span id="resultCount"></span>
                    <span id="searchQuery"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="groups-page">
        <div th:if="${user_name != null}" class="groups-align">
            <h2 class="course-year">Моё расписание</h2>
            <div class="flex-buttons">
                <a th:class="button-href" th:href="@{/schedule/{id}(id=${current_user_group.id})}" th:text="${current_user_group.name}"></a>
            </div>
        </div>

        <div th:each="course : ${courses}" class="groups-align">
            <h2 class="course-year" th:text="${course} + ' КУРС'"></h2>
            <div class="buttons-group">
                <a th:each="group : ${groups_list.get(course-1)}" th:if="${group.id != -1}" th:class="button-href" th:href="@{/schedule/{id}(id=${group.id})}" th:text="${group.name}"></a>
            </div>
        </div>
    </div>


    <div id="noResults" class="no-results">
        <i class="fas fa-search fa-3x mb-3"></i>
        <h4>Ничего не найдено</h4>
        <p class="text-muted">Попробуйте изменить критерии поиска</p>
    </div>
</main>

<footer class="site-footer">
    <div class="footer-inner">
        <p class="copyright">© 2025–2026 V‑IATE — Студенческий портал</p>
        <div class="footer-links">
            <a href="#">О проекте</a>
            <a href="#">Поддержка</a>
            <a href="#">Конфиденциальность</a>
        </div>
    </div>
</footer>

<script src="/js/search_group.js"></script>
</body>
</html>
