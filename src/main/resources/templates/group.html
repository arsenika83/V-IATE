<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Группы</title>
  <link href="/css/style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<header class="p-3 text-bg-dark">
  <div class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
      <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
        <img class="bi me-2" width="60" height="60" role="img" aria-label="Logo" src="../images/logo.png"></use></img>
      </a>
      <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
        <li><a href="/" class="button-header">Главная</a></li>
        <li><a href="/profile" class="button-header">Профиль</a></li>
        <li><a href="/group" class="button-header">Расписание</a></li>
      </ul>
      <div class="text-end">
        <button type="button" class="button-header"><a href="/login">Вход</a></button>
      </div>
    </div>
  </div>
</header>

<div class="groups-align" th:each="course : ${courses}">
  <h2 class="course" th:text="${course} + ' КУРС'"></h2>
  <div class="buttons-group">
    <div th:each="i : ${group_number_skip}">
      <div class="flex-buttons">
        <a class="button-href" th:href="@{/schedule/{id} (id = ${groups[i].id})}" th:text="${groups[i].name}"></a>
        <a class="button-href" th:href="@{/schedule/{id} (id = ${groups[i+1].id})}" th:text="${groups[i+1].name}"></a>
        <a class="button-href" th:href="@{/schedule/{id} (id = ${groups[i+2].id})}" th:text="${groups[i+2].name}"></a>
        <a class="button-href" th:href="@{/schedule/{id} (id = ${groups[i+3].id})}" th:text="${groups[i+3].name}"></a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
