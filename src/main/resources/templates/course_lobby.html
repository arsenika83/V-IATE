<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/common.css" rel="stylesheet">
  <link href="/css/course.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <title>Курсы</title>
</head>
<body>
<header class="site-header">
  <div class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
      <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
        <img class="bi me-2" width="140" height="80" role="img" aria-label="Logo" src="../images/logo.png"></use></img>
      </a>
      <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
        <li><a href="/" class="button-header">Главная</a></li>
        <li><a href="/group" class="button-header">Расписание</a></li>
        <li><a href="/course_lobby" class="button-header">Курсы</a></li>
        <li><a href="/journal" class="button-header">Журналы</a></li>
      </ul>
      <div class="text-end">
        <a th:if="${profile == null}" class="button-login" href="/login">Вход</a>
        <a th:if="${profile != null}" class="button-login" href="/profile">Профиль</a>
        <img th:if="${profile != null}" class="img-user" src="../images/user.png">
      </div>
    </div>
  </div>
</header>

<h2 class="page-title">КУРСЫ</h2>
<div class="course-lobby-container">
  <div class="course-container-student" th:if="${role == 'STUDENT'}">
    <a class="course-a" th:each="course : ${student_courses}" th:href="@{/course?id={course_id} (course_id = ${course.getId()})}">
      <div class="course">
        <h3 class="course-title" th:text="${course.getTitle()}"></h3>
        <h4 class="course-teacher-name" th:text="${course.getTeacher_name()}"></h4>
      </div>
    </a>
  </div>
</div>

</body>
</html>
