<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курсы — V‑IATE</title>
    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/course.css" rel="stylesheet">
</head>
<body>

<header class="site-header">
    <div class="header-container">
        <a href="/" class="logo-link">
            <img src="/images/logo.png" alt="V-IATE" class="logo-img">
        </a>
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="/" class="nav-link">Главная</a></li>
                <li><a href="/group" class="nav-link">Расписание</a></li>
                <li><a href="/course_lobby" class="nav-link active">Курсы</a></li>
                <li><a href="/journal" class="nav-link">Журналы</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a th:if="${profile == null}" href="/login" class="btn-login">Вход</a>
            <div th:if="${profile != null}" class="user-profile">
                <span class="user-greeting" th:text="${profile.full_name[0]}"></span>
                <a href="/profile" class="profile-link">
                    <img src="/images/user.png" alt="Профиль" class="user-avatar">
                </a>
                <a href="/logout" class="logout-link">Выйти</a>
            </div>
        </div>
    </div>
</header>

<main class="main-content">
    <h1 class="page-title">Курсы</h1>
    <div class="course-lobby-container">
        <div class="course-container-student" th:if="${role == 'STUDENT'}">
            <a class="course-a" th:each="course : ${student_courses}" th:href="@{/course?id={course_id}(course_id=${course.id})}">
                <div class="course">
                    <p class="course-title" th:text="${course.title}"></p>
                    <p class="course-teacher-name" th:text="${course.teacher_name}"></p>
                </div>
            </a>
        </div>

        <div class="course-container-student" th:if="${role == 'TEACHER'}">
            <a class="course-a" th:each="course : ${teacher_courses}" th:href="@{/course?id={course_id}(course_id=${course.id})}">
                <div class="course">
                    <p class="course-title" th:text="${course.title}"></p>

                </div>
            </a>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="footer-inner">
        <p class="copyright">© 2025–2026 V‑IATE — Студенческий портал</p>
        <div class="footer-links">
            <a href="#">О проекте</a>
            <a href="#">Поддержка</a>
            <a href="#">Конфиденциальность</a>
        </div>
    </div>
</footer>

</body>
</html>
