<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Профиль</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>

<div class="container">
    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <img class="bi me-2" width="64" height="64" aria-hidden="true" src="../images/logo.png"></img>
            <span class="fs-4">В ИАТЭ</span> </a>
        <ul class="nav nav-pills">
            <li class="nav-item"> <a href="/" class="nav-link active" aria-current="page">Главная</a></li>
            <li class="nav-item"><a href="/profile" class="nav-link">Профиль</a></li>
        </ul>
    </header>
</div>

<div class="container px-4 py-5" id="icon-grid">
    <h2 class="pb-2 border-bottom" th:text="${profile.full_name[0]} + ' ' + ${profile.full_name[1]}"></h2>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 py-5">
        <div class="col d-flex align-items-start">
            <img class="bi text-body-secondary flex-shrink-0 me-3" width="40" height="40" aria-hidden="true" src="../images/calendar.png"></img>
            <div>
                <h3 class="fw-bold mb-0 fs-4 text-body-emphasis">Дата рождения</h3>
                <h4 th:text="${profile.birth_date}"></h4>
            </div>
        </div>
        <div class="col d-flex align-items-start">
            <img class="bi text-body-secondary flex-shrink-0 me-3" width="40" height="40" aria-hidden="true" src="../images/phone.png"></img>
            <div>
                <h3 class="fw-bold mb-0 fs-4 text-body-emphasis">Номер телефона</h3>
                <h4 th:text="${profile.phone}"></h4>
            </div>
        </div>
        <div class="col d-flex align-items-start">
            <img class="bi text-body-secondary flex-shrink-0 me-3" width="40" height="40" aria-hidden="true" src="../images/envelope.png"></img>
            <div>
                <h3 class="fw-bold mb-0 fs-4 text-body-emphasis">e-mail</h3>
                <h4 th:text="${profile.email}"></h4>
            </div>
        </div>
    </div>
</div>

</body>
</html>
