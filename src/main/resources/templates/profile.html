<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Профиль</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>

<header class="p-3 text-bg-dark">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
            <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                <img class="bi me-2" width="80" height="80" role="img" aria-label="Logo" src="../images/logo.png"></use></img>
            </a>
            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                <li><a href="/" class="button-header">Главная</a></li>
                <li><a href="/group" class="button-header">Расписание</a></li>
                <li><a href="/course" class="button-header">Курсы</a></li>
                <li><a href="/journal" class="button-header">Журналы</a></li>
            </ul>
            <div class="text-end">
                <a class="button-logout" href="/logout">Выход</a>
            </div>
        </div>
    </div>
</header>

<div class="container px-4 py-5" id="icon-grid">
    <h2 class="pb-2 border-bottom" th:text="${profile.full_name[0]} + ' ' + ${profile.full_name[1]} + ' ' + ${group.name}"></h2>
</div>

<div class="profile-info-container">
    <div class="profile-info-unit-title">
        <img class="profile-info-img" src="../images/phone.png">
        <h4 class="profile-info-field-title">Номер телефона</h4>
    </div>
    <h4 class="profile-info-field" th:if="${profile.getPhone() != null}" th:text="${profile.getPhone()}"></h4>
    <h4 class="profile-info-field" th:if="${profile.getPhone() == null}">Пусто</h4>

    <div class="profile-info-unit-title">
        <img class="profile-info-img" src="../images/envelope.png">
        <h4 class="profile-info-field-title">Электронная почта</h4>
    </div>
    <h4 class="profile-info-field" th:if="${profile.getEmail() != null}" th:text="${profile.getEmail()}"></h4>
    <h4 class="profile-info-field" th:if="${profile.getEmail() == null}">Пусто</h4>

    <div class="profile-info-unit-title">
        <img class="profile-info-img" src="../images/calendar.png">
        <h4 class="profile-info-field-title">Дата рождения</h4>
    </div>
    <h4 class="profile-info-field" th:if="${profile.getBirth_date() != null}" th:text="${profile.getBirth_date()}"></h4>
    <h4 class="profile-info-field" th:if="${profile.getBirth_date() == null}">Пусто</h4>

</div>

<footer class="site-footer">
    <div class="footer-content">
        <p>© 2025–2026 V-IATE</p>
    </div>
</footer>

</body>
</html>
