<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${group_name}">Расписание</title>
    <link href="/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<header class="p-3 text-bg-dark">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
            <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                <img class="bi me-2" width="80" height="80" role="img" aria-label="Logo" src="../images/logo.png"></use></img>
            </a>
            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                <li><a href="/" class="button-header">Главная</a></li>
                <li><a href="/group" class="button-header">Расписание</a></li>
                <li><a href="/cource" class="button-header">Курсы</a></li>
                <li><a href="/journal" class="button-header">Журналы</a></li>
            </ul>
            <div class="text-end">
                <a th:if="${user_name == null}" class="button-login" href="/login">Вход</a>
                <a th:if="${user_name != null}" class="button-login" href="/profile">Профиль</a>
                <img th:if="${user_name != null}" class="img-user" src="../images/user.png">
            </div>
        </div>
    </div>
</header>

<div class="schedule">
    <div class="empty-check" th:if="${monday_lessons.length > 0}">
        <div class="day-of-week" th:if="${monday_lessons != null}">
                <h3 th:text="${monday_lessons[0].day}"></h3>
                <div class="lesson" th:each="lesson : ${monday_lessons}">
                    <div class="container-type-name">
                        <div class="lesson-type" th:text="'(' + ${lesson.type} + ')'"></div>
                        <div class="lesson-name" th:text="${lesson.name}"></div>
                    </div>
                    <div class="lesson-week" th:text="${lesson.week}"></div>
                    <div class="lesson-classroom" th:text="${lesson.classroom}"></div>
                    <div class="container-time-teacher">
                        <div class="lesson-time" th:text="${lesson.time}"></div>
                        <div class="lesson-teacher" th:text="${lesson.teacher_name}"></div>
                    </div>
                </div>
        </div>
    </div>
    <div class="empty-check" th:if="${tuesday_lessons.length > 0}">
        <div class="day-of-week" th:if="${tuesday_lessons != null}">
                <h3 th:text="${tuesday_lessons[0].day}"></h3>
                <div class="lesson" th:each="lesson : ${tuesday_lessons}">
                    <div class="container-type-name">
                        <div class="lesson-type" th:text="'(' + ${lesson.type} + ')'"></div>
                        <div class="lesson-name" th:text="${lesson.name}"></div>
                    </div>
                    <div class="lesson-week" th:text="${lesson.week}"></div>
                    <div class="lesson-classroom" th:text="${lesson.classroom}"></div>
                    <div class="container-time-teacher">
                        <div class="lesson-time" th:text="${lesson.time}"></div>
                        <div class="lesson-teacher" th:text="${lesson.teacher_name}"></div>
                    </div>
                </div>
        </div>
    </div>
    <div class="empty-check" th:if="${wednesday_lessons.length > 0}">
        <div class="day-of-week" th:if="${wednesday_lessons != null}">
                <h3 th:text="${wednesday_lessons[0].day}"></h3>
                <div class="lesson" th:each="lesson : ${wednesday_lessons}">
                    <div class="container-type-name">
                        <div class="lesson-type" th:text="'(' + ${lesson.type} + ')'"></div>
                        <div class="lesson-name" th:text="${lesson.name}"></div>
                    </div>
                    <div class="lesson-week" th:text="${lesson.week}"></div>
                    <div class="lesson-classroom" th:text="${lesson.classroom}"></div>
                    <div class="container-time-teacher">
                        <div class="lesson-time" th:text="${lesson.time}"></div>
                        <div class="lesson-teacher" th:text="${lesson.teacher_name}"></div>
                    </div>
                </div>
        </div>
    </div>
    <div class="empty-check" th:if="${thursday_lessons.length > 0}">
        <div class="day-of-week" th:if="${day_of_week != 4}">
                <h3 th:text="${thursday_lessons[0].day}"></h3>
                <div class="lesson" th:each="lesson : ${thursday_lessons}">
                    <div class="container-type-name">
                        <div class="lesson-type" th:text="'(' + ${lesson.type} + ')'"></div>
                        <div class="lesson-name" th:text="${lesson.name}"></div>
                    </div>
                    <div class="lesson-week" th:text="${lesson.week}"></div>
                    <div class="lesson-classroom" th:text="${lesson.classroom}"></div>
                    <div class="container-time-teacher">
                        <div class="lesson-time" th:text="${lesson.time}"></div>
                        <div class="lesson-teacher" th:text="${lesson.teacher_name}"></div>
                    </div>
                </div>
        </div>

        <div class="day-of-week-today" th:if="${day_of_week == 4}">
            <h3 th:text="${thursday_lessons[0].day}"></h3>
            <div class="lesson" th:each="lesson : ${thursday_lessons}">
                <div class="container-type-name">
                    <div class="lesson-type" th:text="'(' + ${lesson.type} + ')'"></div>
                    <div class="lesson-name" th:text="${lesson.name}"></div>
                </div>
                <div class="lesson-week" th:text="${lesson.week}"></div>
                <div class="lesson-classroom" th:text="${lesson.classroom}"></div>
                <div class="container-time-teacher">
                    <div class="lesson-time" th:text="${lesson.time}"></div>
                    <div class="lesson-teacher" th:text="${lesson.teacher_name}"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="empty-check" th:if="${friday_lessons.length > 0}">
        <div class="day-of-week" th:if="${friday_lessons != null}">
                <h3 th:text="${friday_lessons[0].day}"></h3>
                <div class="lesson" th:each="lesson : ${friday_lessons}">
                    <div class="container-type-name">
                        <div class="lesson-type" th:text="'(' + ${lesson.type} + ')'"></div>
                        <div class="lesson-name" th:text="${lesson.name}"></div>
                    </div>
                    <div class="lesson-week" th:text="${lesson.week}"></div>
                    <div class="lesson-classroom" th:text="${lesson.classroom}"></div>
                    <div class="container-time-teacher">
                        <div class="lesson-time" th:text="${lesson.time}"></div>
                        <div class="lesson-teacher" th:text="${lesson.teacher_name}"></div>
                    </div>
                </div>
        </div>
    </div>
    <div class="empty-check" th:if="${saturday_lessons.length > 0}">
        <div class="day-of-week" th:if="${saturday_lessons != null}">
                <h3 th:text="${saturday_lessons[0].day}"></h3>
                <div class="lesson" th:each="lesson : ${saturday_lessons}">
                    <div class="container-type-name">
                        <div class="lesson-type" th:text="'(' + ${lesson.type} + ')'"></div>
                        <div class="lesson-name" th:text="${lesson.name}"></div>
                    </div>
                    <div class="lesson-week" th:text="${lesson.week}"></div>
                    <div class="lesson-classroom" th:text="${lesson.classroom}"></div>
                    <div class="container-time-teacher">
                        <div class="lesson-time" th:text="${lesson.time}"></div>
                        <div class="lesson-teacher" th:text="${lesson.teacher_name}"></div>
                    </div>
                </div>
        </div>
    </div>
</div>
</body>
</html>
