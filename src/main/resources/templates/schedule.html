<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${group_name}">Расписание — V‑IATE</title>
    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/schedule.css" rel="stylesheet">
</head>
<body>

<header class="site-header">
    <div class="header-container">
        <a href="/" class="logo-link">
            <img src="/images/logo.png" alt="V-IATE" class="logo-img">
        </a>
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="/" class="nav-link">Главная</a></li>
                <li><a href="/group" class="nav-link active">Расписание</a></li>
                <li><a href="/course_lobby" class="nav-link">Курсы</a></li>
                <li><a href="/journal" class="nav-link">Журналы</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a th:if="${user_name == null}" href="/login" class="btn-login">Вход</a>
            <div th:if="${user_name != null}" class="user-profile">
                <span class="user-greeting" th:text="${user_name}"></span>
                <a href="/profile" class="profile-link">
                    <img src="/images/user.png" alt="Профиль" class="user-avatar">
                </a>
                <a href="/logout" class="logout-link">Выйти</a>
            </div>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="schedule">
        <!-- Понедельник -->
        <div class="empty-check" th:if="${monday_lessons.length > 0}">
            <div class="day-of-week">
                <h3 th:text="${monday_lessons[0].day}"></h3>
                <div class="lesson" th:each="lesson : ${monday_lessons}">
                    <div class="container-type-name">
                        <div class="lesson-type" th:text="'(' + ${lesson.type} + ')'"></div>
                        <div class="lesson-name" th:text="${lesson.name}"></div>
                    </div>
                    <div class="lesson-week" th:text="${lesson.week}"></div>
                    <div class="lesson-classroom" th:text="${lesson.classroom}"></div>
                    <div class="container-time-teacher">
                        <div class="lesson-time" th:text="${lesson.time}"></div>
                        <div class="lesson-teacher" th:text="${lesson.teacher_name}"></div>
                    </div>
                </div>
            </div>

            <div class="day-of-week-today" th:if="${day_of_week == 1}">
                <h3 th:text="${monday_lessons[0].day}"></h3>
                <div class="lesson" th:each="lesson : ${monday_lessons}">
                    <div class="container-type-name">
                        <div class="lesson-type" th:text="'(' + ${lesson.type} + ')'"></div>
                        <div class="lesson-name" th:text="${lesson.name}"></div>

                    <div class="lesson-classroom" th:text="${lesson.classroom}"></div>

                        <div class="lesson-time" th:text="${lesson.time}"></div>
                        <div class="lesson-teacher" th:text="${lesson.teacher_name}"></div>
                    </div>
                </div>
            </div>
        </div>

            <div class="day-of-week-today" th:if="${day_of_week == 2}">

        <!-- Суббота -->

            <div class="day-of-week">

                <div class="lesson" th:each="lesson : ${saturday_lessons}">

<footer class="site-footer">
    <div class="footer-inner">
