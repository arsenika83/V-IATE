<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.title}">Курс — V‑IATE</title>
    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/course.css" rel="stylesheet">
    <link rel="icon" href="/images/favicon.ico">
</head>
<body>

<header class="site-header">
    <div class="header-container">
        <a href="/" class="logo-link">
            <img src="/images/logo.png" alt="V-IATE" class="logo-img">
        </a>
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="/" class="nav-link">Главная</a></li>
                <li><a href="/group" class="nav-link">Расписание</a></li>
                <li><a href="/course_lobby" class="nav-link">Курсы</a></li>
                <li><a href="/journal_lobby" class="nav-link">Журналы</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a th:if="${profile == null}" href="/login" class="btn-login">Вход</a>
            <div th:if="${profile != null}" class="user-profile">
                <span class="user-greeting" th:text="${profile.full_name[0]}"></span>
                <a href="/profile" class="profile-link">
                    <img src="/images/user.png" alt="Профиль" class="user-avatar">
                </a>
                <a href="/logout" class="logout-link">Выйти</a>
            </div>
        </div>
    </div>
</header>

<main class="main-content">
    <h1 class="course-title-page" th:text="${course.title}"></h1>

    <div class="task-container" th:if="${role == 'STUDENT'}">
        <h2 class="section-title" style="margin-bottom:1rem;">📋 Задания</h2>
        <div class="task" th:each="task_number : ${taskCount}" th:with="task=${tasks[task_number]}">
            <p class="task-title" th:text="${task.title}"></p>
            <p class="task-description" th:text="${task.description}"></p>

            <div class="task-upload-form" th:with="submission=${taskSubmissions[task_number]}">
                <div th:if="${submission != null}">
                    <div class="submission-info">
                        Ваше решение:
                        <a th:href="@{/submission/{id}/download(id=${submission.id})}" class="file-link" th:text="${submission.file_name}"></a>
                        (отправлено <span th:text="${#temporals.format(submission.submitted_at, 'dd.MM.yyyy HH:mm')}"></span>)
                    </div>
                    <div th:class="'status-badge status-' + ${taskStatuses[task_number].toLowerCase()}" th:text="${taskStatuses[task_number] == 'REVIEW' ? 'На проверке' : (taskStatuses[task_number] == 'ACCEPTED' ? 'Принято' : 'Отклонено')}"></div>
                </div>
                <form class="upload-file-form" method="post" th:action="@{/task/{id}/submit(id=${task.id}, course_id=${task.course_id})}" enctype="multipart/form-data">
                    <input type="file" name="file">
                    <button type="submit">
                        <span th:if="${submission == null}">Отправить решение</span>
                        <span th:if="${submission != null}">Заменить решение</span>
                    </button>
                </form>
            </div>
        </div>
        <div th:if="${tasks.empty}" class="empty-placeholder">Нет заданий</div>
    </div>

    <div class="task-container" th:if="${role == 'TEACHER'}">
        <div class="card-header">➕ Добавить новое задание</div>
        <div class="card-body">
            <form method="post" th:action="@{/task/add}">
                <input type="hidden" name="course_id" th:value="${course.id}"/>
                <div class="mb-2">
                    <input type="text" name="title" class="form-control" placeholder="Название задания" required>
                </div>
                <div class="mb-2">
                    <textarea name="description" class="form-control" placeholder="Описание задания"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Создать</button>
            </form>
        </div>

        <h2 class="section-title" style="margin-bottom:1rem;">📋 Задания</h2>
        <div class="task" th:each="task_number : ${taskCount}" th:with="task=${tasks[task_number]}">
            <p class="task-title" th:text="${task.title}"></p>
            <p class="task-description" th:text="${task.description}"></p>

            <div class="task-upload-form" th:with="submission=${taskSubmissions[task_number]}">
                <div th:if="${submission != null}">
                    <div class="submission-info">
                        Ваше решение:
                        <a th:href="@{/submission/{id}/download(id=${submission.id})}" class="file-link" th:text="${submission.file_name}"></a>
                        (отправлено <span th:text="${#temporals.format(submission.submitted_at, 'dd.MM.yyyy HH:mm')}"></span>)
                    </div>
                    <div th:class="'status-badge status-' + ${taskStatuses[task_number].toLowerCase()}" th:text="${taskStatuses[task_number] == 'REVIEW' ? 'На проверке' : (taskStatuses[task_number] == 'ACCEPTED' ? 'Принято' : 'Отклонено')}"></div>
                </div>
                <form class="upload-file-form" method="post" th:action="@{/task/{id}/submit(id=${task.id}, course_id=${task.course_id})}" enctype="multipart/form-data">
                    <input type="file" name="file">
                    <button type="submit">
                        <span th:if="${submission == null}">Отправить решение</span>
                        <span th:if="${submission != null}">Заменить решение</span>
                    </button>
                </form>
            </div>
        </div>
        <div th:if="${tasks.empty}" class="empty-placeholder">Нет заданий</div>
    </div>
</main>

<footer class="site-footer">
    <div class="footer-inner">
        <p class="copyright">© 2025–2026 V‑IATE — Студенческий портал</p>
        <div class="footer-links">
            <a href="#">О проекте</a>
            <a href="#">Поддержка</a>
            <a href="#">Конфиденциальность</a>
        </div>
    </div>
</footer>

</body>
</html>
