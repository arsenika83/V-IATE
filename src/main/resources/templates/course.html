<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/common.css" rel="stylesheet">
  <link href="/css/course.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <title th:text="${course.getTitle()}"></title>
</head>
<body>
<header class="site-header">
  <div class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
      <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
        <img class="bi me-2" width="140" height="80" role="img" aria-label="Logo" src="../images/logo.png"></use></img>
      </a>
      <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
        <li><a href="/" class="button-header">Главная</a></li>
        <li><a href="/group" class="button-header">Расписание</a></li>
        <li><a href="/course_lobby" class="button-header">Курсы</a></li>
        <li><a href="/journal" class="button-header">Журналы</a></li>
      </ul>
      <div class="text-end">
        <a th:if="${profile == null}" class="button-login" href="/login">Вход</a>
        <a th:if="${profile != null}" class="button-login" href="/profile">Профиль</a>
        <img th:if="${profile != null}" class="img-user" src="../images/user.png">
      </div>
    </div>
  </div>
</header>

<div class="task-container">
  <h2 class="page-title">Задания</h2>
  <div class="task" th:each="task : ${tasks}">
    <h3 class="task-title" th:text="${task.getTitle()}"></h3>
    <h6 class="task-description" th:text="${task.getDescription()}"></h6>

    <form id="uploadForm" enctype="multipart/form-data">
      <input type="file" id="file" name="file">
      <button type="submit">Загрузить</button>
    </form>
    <div id="progress"></div>
  </div>
</div>


</body>

<script>
  // Загрузка с прогрессом
  const form = document.getElementById('uploadForm');
  const urlParams = new URLSearchParams(window.location.search);
  form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const formData = new FormData();
  formData.append('file', document.getElementById('file').files[0]);
  formData.append('course_id', urlParams.get('id'));

  const xhr = new XMLHttpRequest();

  xhr.upload.addEventListener('progress', (event) => {
  if (event.lengthComputable) {
    const percent = (event.loaded / event.total) * 100;
    document.getElementById('progress').textContent =
    `Прогресс: ${Math.round(percent)}%`;
  }
  });

  xhr.onload = () => {
  if (xhr.status === 200) {
    alert('Файл загружен!');

  }
  };

  xhr.open('POST', 'http://localhost:8080/user_files/upload');
  xhr.send(formData);
  });
</script>

<script>
    const url = 'http://localhost:8080/update_task_status';

    async function updateTaskStatus(id, status) {
      try {
        const response = await fetch(`${url}/${id}?status=${status}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(status)
        });

        const updatedTask = await response.json();
        console.log('Обновлен:', updatedTask);
        return updatedTask;
      } catch (error) {
        console.error('Ошибка:', error);
      }
    }
</script>
</html>
