<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>V-IATE · Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/sign-in.css" rel="stylesheet">
</head>
<body>

    <main class="container">
        <form th:action="@{/login}" method="post">
            <div class="logo-container">
                <img th:src="@{/images/logo_black.png}" alt="V-IATE" width="80" height="80">
            </div>
            <h1>Добро пожаловать</h1>

            <div th:if="${error}" class="alert" role="alert">
                <span th:text="${error}"></span>
            </div>

            <div class="input-group">
                <p>Логин</p>
                <input type="text" id="login" name="login" placeholder="Введите ваш логин" autofocus>
            </div>

            <div class="input-group">
                <p>Пароль</p>
                <input type="password" id="password" name="password" placeholder="Введите пароль">
            </div>

            <button type="submit">Войти →</button>
        </form>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>© 2025–2026 V-IATE — Умный студенческий портал</p>
        </div>
    </footer>

</body>
</html>
